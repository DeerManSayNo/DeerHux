name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build NSIS installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate source
        run: |
          npx tsc --noEmit
          npm run test:core

      - name: Download bundled Node runtime
        run: npm run download:node:win

      - name: Verify bundled Node runtime
        shell: pwsh
        run: |
          $node = "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"
          $version = & $node --version
          if ([version]$version.TrimStart('v') -lt [version]'22.19.0') {
            throw "Bundled Node $version does not satisfy >=22.19.0"
          }

      - name: Build Windows installer
        run: npm run tauri:build:win

      - name: Smoke test standalone with bundled Node
        run: node scripts/smoke-standalone.js --node src-tauri/binaries/node-x86_64-pc-windows-msvc.exe

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: DeerHux-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
