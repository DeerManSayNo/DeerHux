<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DeerHux</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      --base: #fcfcfc;
      --text: #202022;
      --muted: #626268;
      --border: #e3e3e5;
      --brand: #ff6b1a;
      --danger: #c52c50;
      --danger-bg: #fdebf0;
      --danger-border: #edc7d0;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; overflow: hidden; }
    body {
      position: relative;
      display: grid;
      place-items: center;
      background: var(--base);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    main {
      position: relative;
      z-index: 1;
      width: min(420px, calc(100vw - 48px));
      text-align: center;
    }
    .brand {
      display: block;
      width: min(196px, 100%);
      height: auto;
      margin: 0 auto 28px;
      opacity: 0;
      transform: translateY(5px);
      animation: brand-in 360ms cubic-bezier(.2, .8, .2, 1) 60ms forwards;
    }
    .activity { display: flex; align-items: center; justify-content: center; gap: 9px; }
    .activity-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--brand);
      animation: activity-pulse 1.5s ease-in-out infinite;
    }
    h1 { margin: 0; color: var(--text); font-size: 13px; font-weight: 500; line-height: 1.55; letter-spacing: 0; }
    #message { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    #detail {
      display: none;
      max-height: min(180px, 30vh);
      padding: 12px 14px;
      margin: 20px 0 0;
      overflow: auto;
      overflow-wrap: anywhere;
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      color: var(--danger);
      background: var(--danger-bg);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      line-height: 1.55;
      text-align: left;
      white-space: pre-wrap;
    }
    .error .activity-dot { display: none; }
    .error h1 { color: var(--danger); }
    .error #detail { display: block; }
    @keyframes brand-in { to { opacity: 1; transform: translateY(0); } }
    @keyframes activity-pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-color-scheme: dark) {
      :root {
        --base: #282a2b;
        --text: #ededee;
        --muted: #b0b0b6;
        --border: #3c3c40;
        --brand: #ff8a45;
        --danger: #ff8ba6;
        --danger-bg: #3c222c;
        --danger-border: #63404a;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand { opacity: 1; transform: none; animation: none; }
      .activity-dot { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main id="status" role="status" aria-live="polite">
    <picture>
      <source srcset="deerhux-v2-lockup-dark.svg" media="(prefers-color-scheme: dark)">
      <img class="brand" src="deerhux-v2-lockup.svg" alt="DeerHux" width="620" height="180">
    </picture>
    <div class="activity">
      <span class="activity-dot" aria-hidden="true"></span>
      <h1 id="title">正在启动 DeerHux</h1>
    </div>
    <p id="message">正在准备本地工作区</p>
    <p id="detail"></p>
  </main>
  <script>
    window.__DEERHUX_STARTUP_ERROR = function (message) {
      document.getElementById('status').classList.add('error');
      document.getElementById('title').textContent = 'DeerHux 启动失败';
      document.getElementById('message').textContent = '请退出后重试。若问题持续，请将下方信息和启动日志提供给开发者。';
      document.getElementById('detail').textContent = message + '\n日志：~/.deerhux/agent/logs/desktop-startup.log';
    };
  </script>
</body>
</html>
